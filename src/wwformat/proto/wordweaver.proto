// wordweaver.proto
//
// Payload messages for the v1 .wwproj chunks (see ADR 0003).
// Each chunk type in wwformat/registry.py maps to one message here.
//
// After editing this file, regenerate wordweaver_pb2.py from the repo root:
//   uv run python -m grpc_tools.protoc -I src/wwformat/proto --python_out=src/wwformat src/wwformat/proto/wordweaver.proto
//
// Conventions, so the record tables stay generic:
// - Fields holding text are uint32 indexes into the string table, where 0 is "".
// - Every record has a stable `uint64 id = 1` that's unique in the Project.
// - Every table message is just `repeated <Record> records = 1`.
// - Only add new fields; never renumber or reuse a field number.

syntax = "proto3";

package wordweaver.v1;

// Chunk STRING_TABLE. Holds the strings for indexes 1..n, since 0 is always "".
message StringTable {
  repeated string strings = 1;
}

// Chunk PROJECT.
message ProjectInfo {
  uint32 name = 1;
  // The next unused record ID, so IDs are never reused after a delete.
  uint64 next_id = 2;
  // The Gloss Language as a BCP 47 code, like "en". Empty means English, so older files load as English.
  uint32 gloss_language = 3;
}

// A label for a Language. It doesn't change how the Language works.
// LANGUAGE is 0 so a Language saved without a kind loads as a plain Language.
enum LanguageKind {
  LANGUAGE_KIND_LANGUAGE = 0;
  LANGUAGE_KIND_PROTO_LANGUAGE = 1;
  LANGUAGE_KIND_DIALECT = 2;
  LANGUAGE_KIND_CREOLE = 3;
}

message Language {
  uint64 id = 1;
  uint32 name = 2;
  LanguageKind kind = 3;
  // The first of the IDs held back for this Language's default Phoneme Classes.
  // Default Classes aren't saved, so this keeps their IDs the same across loads.
  // 0 means the file is from before Phoneme Classes.
  uint64 default_class_ids_start = 4;
}

// Chunk LANGUAGES.
message LanguageTable {
  repeated Language records = 1;
}

message Phoneme {
  uint64 id = 1;
  uint64 language_id = 2;
  // The Phoneme's IPA symbol.
  uint32 symbol = 3;
}

// Chunk PHONEMES.
message PhonemeTable {
  repeated Phoneme records = 1;
}

// A Phoneme Class the user made, or a default one they changed.
// Untouched default Classes aren't saved, since they're rebuilt from IPA features on load.
message PhonemeClass {
  uint64 id = 1;
  uint64 language_id = 2;
  uint32 name = 3;
  // For a default Class, which one it is, like "nasal". 0 for the user's own Classes.
  uint32 default_key = 4;
  // Whether phoneme_ids is the Class's whole membership.
  // A default Class that was only renamed leaves this off and keeps filling in from IPA features.
  bool hand_edited = 5;
  repeated uint64 phoneme_ids = 6;
}

// Chunk PHONEME_CLASSES.
message PhonemeClassTable {
  repeated PhonemeClass records = 1;
}

message Entry {
  uint64 id = 1;
  uint64 language_id = 2;
  // The Form, one IPA symbol per Phoneme, in order.
  repeated uint32 form = 3;
  // The IDs of the Entry's Tags, in the order they were added.
  // They live on the Entry, so tagging one Entry only changes that Entry's record.
  repeated uint64 tag_ids = 4;
}

// Chunk ENTRIES.
message EntryTable {
  repeated Entry records = 1;
}

// The open dictionary a Concept Reference points into.
// NONE is 0, so a Definition saved without a reference loads without one.
enum ConceptSource {
  CONCEPT_SOURCE_NONE = 0;
  CONCEPT_SOURCE_OPEN_ENGLISH_WORDNET = 1;
  CONCEPT_SOURCE_OPEN_MULTILINGUAL_WORDNET = 2;
  CONCEPT_SOURCE_CONCEPTICON = 3;
}

// An Entry's Definitions are kept in `position` order, then ID order for any ties.
message Definition {
  uint64 id = 1;
  uint64 entry_id = 2;
  repeated uint32 glosses = 3;
  // Where the Definition goes among its Entry's Definitions, starting at 0.
  uint32 position = 4;
  // Technical linguistic terms, in order.
  repeated uint32 terms = 5;
  // A free-text description.
  uint32 description = 6;
  // An optional Concept Reference: the source, plus that source's own ID, like "oewn-09213565-n".
  ConceptSource concept_source = 7;
  uint32 concept_id = 8;
}

// Chunk DEFINITIONS.
message DefinitionTable {
  repeated Definition records = 1;
}

// A Tag belongs to the Project, so every Language can use it.
message Tag {
  uint64 id = 1;
  uint32 name = 2;
}

// Chunk TAGS.
message TagTable {
  repeated Tag records = 1;
}
