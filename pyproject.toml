[project]
name = "wordweaver"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "ipapy",
    "platformdirs>=4.14.5",
    "protobuf>=7.36.2",
    "pyinstaller>=6.22.3",
    "pyperclip>=1.11.0",
    "pyqt6>=6.12.1",
    "sphinx>=9.2.0",
    "wn>=1.1.1",
]

[project.scripts]
wordweaver = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/main.py"]

[tool.uv.sources]
ipapy = { git = "https://github.com/PrestonHager/ipapy", rev = "v0.0.10.0" }

[dependency-groups]
dev = [
    "grpcio-tools>=1.85.1",
]

# Pyright is what Pylance runs, so `uvx pyright` shows the same errors as VS Code.
# NOTE: the PyQt6 6.12 stubs have two bugs, `pyqtSignal()` wants an `arguments` keyword and
# `QWidget.__init__` types `parent` as `Self`. Lines that hit them have a narrow `pyright: ignore`.
[tool.pyright]
include = ["src", "test", "scripts"]
exclude = ["**/__pycache__", ".venv", ".claude", "build", "dist", "docs", "tools"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
# Tests look things up and use them straight away. If one comes back None the test fails anyway, so don't flag it.
executionEnvironments = [
    { root = "test", extraPaths = ["src"], reportOptionalMemberAccess = false },
    { root = "." },
]
